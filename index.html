<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Shrek</title>
</head>

<body>
    <header> <!--Cabeçalho do meu site-->
        <img src="./IMAGENS/LOGO.png" alt="shrek" id="logo">
        <nav class="navegador">
            <a href="index.html"> Página inicial</a>
            <a href="personagem.html">Personagens</a>
            <a href="#filmes">Filmes</a>
        </nav>
    </header>
    <main>
        <section class="shrek"> <!--Seção para o meu banner-->
            <h1>Shrek</h1>
        </section>
        <section id="personagens" class="personagem"> <!--Seção para os personagens-->
            <h2 id="titulo">Personagens</h2>
            <div id="fundo_shrek" class="personagem"> <!--bloco do shrek-->
                <img src="./IMAGENS/SHREK PERSONAGEM PRINCIPAL.jpg" alt="shrek" id="principal">
                <h2>Shrek</h2>
                
            </div>
            <div class="personagem" id="fundo_burro"> <!--Bloco do burro-->
                <img src="./IMAGENS/BURRO PERSONA.jpg" alt="burro" id="burro" >
                <h2>Burro</h2>
            </div>
            <div class="personagem" id="fundo_gato"> <!--Bloco do Gato-->
                <img src="./IMAGENS/GATO PERSONA.jpg" alt="gato" id="gato">
                <h2>Gato de Botas</h2>
            </div>
        </section>


        <section id="filmes" class="filmes"> <!--Seção de filmes-->
            <h2 id="favoritos">Filmes Favoritos</h2>
            <div class="filmes">
                <img src="./IMAGENS/CAPA FILME.jpg" alt="Shrek 1" id="shrek">
            <h2>Shrek 1</h2>
            </div>
            <div class="filmes">
                <img src="./IMAGENS/CAPA FILME 2.jpg" alt="Shrek 2">
            <h2>Shrek 2</h2>
            </div>    
            
        </section>
    </main>

    <footer>
        <small>DESENVOLVIDO Jonathan Henrique | © TODOS OS DIREITOS RESERVADOS</small>

    </footer>












</body>

</html>
